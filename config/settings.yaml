---
# ============================================================
# Lab Results Automation — Settings
# ============================================================
# IMPORTANT: Do NOT commit credentials to git.
# Store your login in a .env file or in your OS keyring.
# ============================================================

coral:
  base_url: "https://coralhealth.app"
  # Login credentials — use environment variables (recommended):
  #   CORAL_EMAIL=your@email.com
  #   CORAL_PASSWORD=yourpassword
  # Or set directly here (NOT recommended for shared repos):
  email: ""
  password: ""

  # Selectors confirmed by browser DevTools inspection of coralhealth.app
  selectors:
    # Member search — MUI DataGrid quick-filter searchbox
    search_member_input: "input[role='searchbox']"

    # A member row in the data grid — click to navigate to member profile
    member_row: "div[role='row'][data-rowindex]"

    # "Lab test results" questionnaire link on the member profile page
    lab_results_link: "a[href*='/questionnaire/']:has-text('Lab test results')"

    # "+" icon button to create a new lab result entry (MuiIconButton-sizeLg)
    add_new_button: "button.MuiIconButton-sizeLg"

    # Effective date input (data-testid confirmed from inspection)
    effective_date_input: "div[data-testid='effective-date-input'] input[type='date']"

    # Individual numeric lab field inputs — nth(i) maps to field index in tests.txt
    lab_field_input: "div[data-testid='freeTextInput'] input"

    # Hidden file input for PDF upload (triggered via the AttachFile icon button)
    file_upload_input: "input[type='file']"
    file_upload_button: "button:has(svg[data-testid='AttachFileSvgIcon'])"

    # Publish / submit button
    publish_button: "button:has-text('Publish')"

  # How long to wait for page elements (milliseconds)
  timeout_ms: 10000
  # Delay between keystrokes (seconds) — increase if connection is slow
  type_delay: 0.05
  # Delay between tab presses (seconds)
  tab_delay: 0.08

ocr:
  # Tesseract language: 'eng', 'fra', or 'eng+fra' (both, recommended)
  default_lang: "eng+fra"
  # DPI for scanned PDF rendering (300 = good quality, 200 = faster)
  dpi: 300
  # PSM mode: 6 = assume uniform block of text (good for lab reports)
  psm: 6

matching:
  # Minimum Levenshtein/fuzzy score (0-100) to auto-accept a marker name match
  marker_auto_accept_score: 88
  # Patient name fuzzy threshold (0-100)
  patient_name_threshold: 82
  # Always require confirmation for patient matches below this confidence
  patient_confirm_below: 0.95

paths:
  tests_file: "config/tests.txt"
  units_file: "config/units.txt"
  panels_file: "config/panels.yaml"
  marker_aliases_file: "config/marker_aliases.yaml"
  # Where to save missing marker reports
  reports_dir: "reports"
