---
# ============================================================
# Standard Panel Definitions
# ============================================================
# These are the actual panels used in practice.
# The missing marker checker uses these to:
#   1. Auto-detect which panel was ordered
#   2. Flag markers expected but not found in the PDF
#   3. Flag extra markers (nurse-requested, outside standard panels)
#
# Panel AB = Panel A + Panel B (full union, handled below)
# ============================================================

panels:

  # ──────────────────────────────────────────────────────────
  # PANEL A
  # Full metabolic + CBC + thyroid + lipid + hormones (cortisol only)
  # ──────────────────────────────────────────────────────────
  PANEL_A:
    label_en: "Panel A"
    label_fr: "Panneau A"
    markers:
      # CBC (ordered as one test — expands to all sub-markers in the PDF)
      - RBC
      - WBC
      - Hemoglobin
      - MCV
      - MCHC
      - MCH
      - RDW-cv
      - Platelets
      - MPV
      - Neutrophils
      - Lymphocytes
      - Monocytes
      - Eosinophils
      - Basophils
      # Metabolic / renal
      - Creatinine
      - Sodium
      - Potassium
      - Chloride
      - Magnesium
      - Glucose
      # Liver
      - ALT
      # Lipid
      - Total Cholesterol
      - LDL Cholesterol
      - HDL Cholesterol
      - Non-HDL Cholesterol
      - Triglycerides
      - ApoB
      # Iron / vitamins
      - Ferritin
      - Vitamin D 25-OH
      # Inflammation
      - hs-CRP
      # Diabetes / metabolic
      - HbA1c
      - Insulin
      - Uric Acid
      # Thyroid
      - TSH
      - Free T3
      - Free T4
      # Adrenal
      - Cortisol AM

  # ──────────────────────────────────────────────────────────
  # PANEL B
  # Full hormone panel (reproductive)
  # ──────────────────────────────────────────────────────────
  PANEL_B:
    label_en: "Panel B"
    label_fr: "Panneau B"
    markers:
      - Beta HCG
      - Testosterone Total
      - Free Testosterone
      - SHBG
      - DHEAS
      - Prolactin
      - FSH
      - LH
      - Estradiol
      - Progesterone

  # ──────────────────────────────────────────────────────────
  # LIGHT PANEL B
  # Minimal reproductive hormone panel
  # ──────────────────────────────────────────────────────────
  PANEL_B_LIGHT:
    label_en: "Light Panel B"
    label_fr: "Panneau B léger"
    markers:
      - FSH
      - LH
      - Estradiol
      - Progesterone

  # ──────────────────────────────────────────────────────────
  # PANEL AB  (Panel A + Panel B combined)
  # ──────────────────────────────────────────────────────────
  PANEL_AB:
    label_en: "Panel AB"
    label_fr: "Panneau AB"
    markers:
      # ── All of Panel A ──
      - RBC
      - WBC
      - Hemoglobin
      - MCV
      - MCHC
      - MCH
      - RDW-cv
      - Platelets
      - MPV
      - Neutrophils
      - Lymphocytes
      - Monocytes
      - Eosinophils
      - Basophils
      - Creatinine
      - Sodium
      - Potassium
      - Chloride
      - Magnesium
      - Glucose
      - ALT
      - Total Cholesterol
      - LDL Cholesterol
      - HDL Cholesterol
      - Non-HDL Cholesterol
      - Triglycerides
      - ApoB
      - Ferritin
      - Vitamin D 25-OH
      - hs-CRP
      - HbA1c
      - Insulin
      - Uric Acid
      - TSH
      - Free T3
      - Free T4
      - Cortisol AM
      # ── All of Panel B ──
      - Beta HCG
      - Testosterone Total
      - Free Testosterone
      - SHBG
      - DHEAS
      - Prolactin
      - FSH
      - LH
      - Estradiol
      - Progesterone
